[program:anchor-api]
command=/usr/bin/env PORT=3001 /usr/local/node/bin/node /app/code/server/dist/src/main
directory=/app/code/server
user=cloudron
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:anchor-web]
command=/bin/bash -c "until curl -fsS http://127.0.0.1:3001/api/health >/dev/null 2>&1; do sleep 1; done; exec env PORT=3000 HOSTNAME=0.0.0.0 SERVER_URL=http://127.0.0.1:3001 /usr/local/node/bin/node /app/code/web/server.js"
directory=/app/code/web
user=cloudron
priority=20
autostart=true
autorestart=true
startsecs=10
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
