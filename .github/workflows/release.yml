name: Publish or promote package

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Release operation
        required: true
        type: choice
        options:
          - publish-testing
          - promote-published
      version:
        description: Package version from CloudronManifest.json
        required: true
        type: string

concurrency:
  group: anchor-cloudron-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/wisemetalhead/anchor-cloudron

jobs:
  publish-testing:
    if: inputs.operation == 'publish-testing'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Verify requested version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$(jq -r '.version' CloudronManifest.json)" = "${VERSION}"
          test "$(jq -r --arg version "${VERSION}" '.versions[$version] == null' CloudronVersions.json)" = "true"
          ./scripts/check-metadata.sh

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for acceptance
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: anchor-cloudron:release
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}

      - name: Smoke test release image
        run: ./test/smoke.sh anchor-cloudron:release

      - name: Push immutable image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Add testing catalog entry
        env:
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          npm install --global cloudron
          cloudron versions add --image "${IMAGE_NAME}@${DIGEST}" --state testing
          cloudron versions verify
          test "$(jq -r --arg version "${VERSION}" '.versions[$version].publishState' CloudronVersions.json)" = "testing"

      - name: Commit catalog and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CloudronVersions.json
          git commit -m "release: package ${VERSION} for testing"
          git tag -a "v${VERSION}" -m "Anchor Cloudron package ${VERSION}"
          git push origin HEAD:main "v${VERSION}"
          gh release create "v${VERSION}" --title "Anchor Cloudron ${VERSION}" --generate-notes

  promote-published:
    if: inputs.operation == 'promote-published'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Promote tested version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm install --global cloudron
          test "$(jq -r --arg version "${VERSION}" '.versions[$version].publishState' CloudronVersions.json)" = "testing"
          cloudron versions update --version "${VERSION}" --state published
          cloudron versions verify

      - name: Commit published catalog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CloudronVersions.json
          git commit -m "release: publish package ${VERSION}"
          git push origin HEAD:main
